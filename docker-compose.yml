version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: shopsphere-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopsphere}
      POSTGRES_USER: ${POSTGRES_USER:-shopsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopsphere}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopsphere} -d ${POSTGRES_DB:-shopsphere}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-shopsphere}:${POSTGRES_PASSWORD:-shopsphere}@db:5432/${POSTGRES_DB:-shopsphere}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    healthcheck:
      # The image has no curl; use the interpreter that is already there.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - PORT=3000
    ports:
      - "3000:3000"
    # The image's own CMD (`node server.mjs`) is used: dist/server/server.js is
    # a Web `fetch` handler, not a runnable Node HTTP server.
    command: node server.mjs

volumes:
  pgdata:
